<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Ansluter till 1996...</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #008080; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; }
  .win { width: 500px; max-width: 96vw; background: #c0c0c0; border: 2px solid; border-color: #fff #404040 #404040 #fff; box-shadow: 1px 1px 0 #000; padding: 3px; }
  .title { background: #000080; color: #fff; font-weight: bold; font-size: 14px; padding: 3px 4px; display: flex; justify-content: space-between; align-items: center; }
  .title .x { background: #c0c0c0; color: #000; width: 16px; height: 14px; line-height: 12px; text-align: center; font-size: 12px; border: 1px solid; border-color: #fff #404040 #404040 #fff; }
  .body { padding: 10px; }
  .body img { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; border: 2px solid; border-color: #808080 #fff #fff #808080; }
  #status { margin: 10px 0 6px; font-size: 14px; min-height: 18px; }
  .bar { height: 20px; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 2px; }
  #fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, #000080 0, #000080 10px, #fff 10px, #fff 12px); }
  .buttons { text-align: center; margin-top: 12px; }
  #connect { font-size: 16px; font-weight: bold; padding: 6px 28px; }
  #help { font-size: 12px; margin-top: 8px; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="win">
  <div class="title"><span>Ansluter till 1996</span><span class="x">x</span></div>
  <div class="body">
    <img src="resources/wlan.gif" alt="Ringer upp 1996">
    <div id="status">Redo att ringa upp 1996. Slå på ljudet!</div>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="buttons">
      <button id="connect" type="button">Connect</button>
    </div>
    <div id="help" class="hidden">Tryck Esc för att hoppa över modemet.</div>
  </div>
</div>
<audio id="modem" src="resources/kindkinder-dial-up-modem-434763.mp3" preload="auto"></audio>
<script src="js/modem.js"></script>
<noscript><p class="center"><a href="welcome.html">Gå in i 1996 (ingen JavaScript, ingen modem)</a></p></noscript>
</body>
</html>
